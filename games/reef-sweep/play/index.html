<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#103b43"><meta name="description" content="Reef Sweep: a first-person reef conservation and diving business adventure. A Samfa12 game."><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Reef Sweep · Lantern Bay</title><link rel="stylesheet" href="style.css?v=0.5.0-preview.1"></head>
<body><canvas id="ocean" tabindex="0" aria-label="First-person underwater game. Press Escape to pause and read controls."></canvas>
<div id="mask-water" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><div id="vignette" aria-hidden="true"></div><div id="flash" aria-hidden="true"></div>
<div id="loading"><div class="wordmark">Reef Sweep<span>DIVING CO.</span></div><p>Making room for life…</p></div>
<div id="hud" hidden><div class="hud-top"><div class="dive-computer"><div class="airline"><span class="micro">AIR</span><strong id="air">200</strong><span class="unit">bar*</span><div class="air-meter"><i id="air-fill"></i></div><span id="depth">10.0 m</span></div><div class="computer-bottom"><span id="bag">0 / 8 secured</span><span id="clock">00:00</span><span id="condition"></span></div></div><div class="hud-buttons"><button id="fullscreen-button" title="Enter full screen" aria-label="Enter full screen">⛶</button><button id="chart-button" title="Chart and field notes (J)">Chart <kbd>J</kbd></button><button id="watch-button" data-action="watch" aria-describedby="watch-readout" aria-pressed="false" title="Raise or lower dive computer (V)">Watch <kbd>V</kbd></button><button id="pause-button" title="Pause">Ⅱ</button></div></div><div id="reticle" aria-hidden="true"><i></i><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="25"/><circle id="charge-ring" cx="32" cy="32" r="25"/></svg></div><div id="home-marker" aria-hidden="true">⌂ <span>HOME</span></div><div id="interaction"><strong id="aim-label"></strong><span id="aim-hint"></span><div id="work-meter"><i></i></div></div><button id="clear-mask" hidden>Clear mask · 2 bar</button><div id="dive-caption"></div><div id="return-warning" hidden>RETURN RECOMMENDED · Keep your reserve for the journey home</div><div id="touch-controls"><div id="joystick" aria-label="Movement joystick"><div id="joy-knob"></div></div><div class="touch-vertical"><button data-touch="up" aria-label="Ascend">↑</button><button data-touch="down" aria-label="Descend">↓</button></div><div class="touch-actions"><button data-touch="steady" class="small-touch">Steady</button><button data-touch="scooter" class="small-touch">Gear</button><button data-touch="light" class="small-touch" aria-label="Toggle head torch">Light</button><button data-touch="interact" class="interact-touch">Interact</button><button data-touch="spear" class="spear-touch">Draw<br><small>drag to aim</small></button></div></div><aside id="campaign-objective" aria-live="polite"><p id="campaign-progress"></p><p id="lesson-text" hidden></p><button id="lesson-skip" hidden>Skip tutorial</button></aside><div id="controls-hint"></div><p id="watch-readout" class="visually-hidden"></p></div>
<div id="menu-backdrop"></div><main id="panel" aria-live="off"></main><div id="toast" role="status" aria-live="polite"></div><div id="storage-warning" role="alert" hidden></div><div id="rotate" hidden><span>↻</span><h2>A wider view of the reef.</h2><p>Rotate your phone to landscape.<br>Your dive is paused.</p></div><input id="import-file" type="file" accept="application/json,.json" hidden><div id="debug-stats" hidden></div>
<script src="babylon.js"></script><script src="game.js?v=0.5.0-preview.1"></script></body></html>
