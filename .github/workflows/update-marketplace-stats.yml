name: Update public marketplace statistics

on:
  schedule:
    # Sunday 21:00 UTC is Monday morning in Australia/Sydney (with a one-hour
    # seasonal shift when daylight saving changes).
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-marketplace-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check marketplace configuration
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          STEAM_FINANCIAL_API_KEY: ${{ secrets.STEAM_FINANCIAL_API_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_SALES_URI: gs://pubsite_prod_7761853381809168545/sales/
        run: npm run marketplace:check

      - name: Update sanitised marketplace statistics
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          STEAM_FINANCIAL_API_KEY: ${{ secrets.STEAM_FINANCIAL_API_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_SALES_URI: gs://pubsite_prod_7761853381809168545/sales/
        run: npm run marketplace:update

      - name: Test marketplace statistics
        run: npm run test:marketplace

      - name: Validate public data and site
        run: |
          npm run validate:catalogue
          npm run validate:site

      - name: Commit changed generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/public-stats.json data/public-stats-history.json ops/marketplace/steam-state.json
          if git diff --cached --quiet; then
            echo "Marketplace statistics are already current."
          else
            git commit -m "chore: refresh public marketplace stats"
            git push
          fi
