name: Update Briarhold browser statistics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-briarhold-stats.yml"
      - "scripts/briarhold-browser-stats.mjs"
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-briarhold-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test statistics collectors and counters
        run: node --test tests/analytics-bridge.test.mjs tests/briarhold-stats.test.mjs tests/briarhold-browser-stats.test.mjs
      - name: Collect verified game-page traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
          ANALYTICS_HOSTNAME: samfa12.com
        run: node scripts/briarhold-browser-stats.mjs
      - name: Publish aggregate snapshot only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/briarhold-browser-stats.json
          if git diff --cached --quiet; then
            echo "Briarhold statistics are already current."
          else
            git commit -m "chore: refresh Briarhold browser-play statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
