name: Verify itch.io and Steam marketplace access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-marketplace-providers
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify itch.io and Steam access without publishing data
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          STEAM_FINANCIAL_API_KEY: ${{ secrets.STEAM_FINANCIAL_API_KEY }}
        run: npm run marketplace:verify-providers
