name: Daily Samfa12 social post

on:
  schedule:
    # 22:15 UTC is 08:15 AEST / 09:15 AEDT in Australia/Sydney.
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "What should this test run do?"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - list-channels
          - draft
          - publish

permissions:
  contents: write

concurrency:
  group: samfa12-daily-social-post
  cancel-in-progress: false

jobs:
  post:
    # Scheduled publishing remains OFF until the repository variable
    # SOCIAL_AUTOMATION_ENABLED is explicitly set to true. Manual tests work
    # regardless of that variable.
    if: github.event_name == 'workflow_dispatch' || vars.SOCIAL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Choose social action
        id: social-action
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Run social automation
        env:
          SOCIAL_ACTION: ${{ steps.social-action.outputs.value }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
          BUFFER_X_CHANNEL_NAME: ${{ vars.BUFFER_X_CHANNEL_NAME }}
        run: node scripts/social-post.mjs

      - name: Commit posting history
        if: steps.social-action.outputs.value == 'publish'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- marketing/posting-history.json
          if git diff --cached --quiet; then
            echo "No posting-history change to commit."
          else
            git commit -m "chore: record automated social post"
            git push
          fi
