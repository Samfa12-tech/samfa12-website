name: Weekly Samfa12 social schedule

on:
  schedule:
    # Sunday 09:00 UTC = 19:00 AEST / 20:00 AEDT in Australia/Sydney.
    # The workflow then schedules one post per day for the following 7 days.
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      action:
        description: "What should this run do?"
        required: true
        default: "preview-week"
        type: choice
        options:
          - preview-week
          - schedule-week
          - dry-run
          - list-channels
          - draft
          - publish

permissions:
  contents: write

concurrency:
  group: samfa12-weekly-social-schedule
  cancel-in-progress: false

jobs:
  post:
    # Automatic weekly scheduling remains OFF until the repository variable
    # SOCIAL_AUTOMATION_ENABLED is explicitly set to true. Manual tests work
    # regardless of that variable.
    if: github.event_name == 'workflow_dispatch' || vars.SOCIAL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Choose social action
        id: social-action
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=schedule-week" >> "$GITHUB_OUTPUT"
          fi

      - name: Run social automation
        env:
          SOCIAL_ACTION: ${{ steps.social-action.outputs.value }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
          BUFFER_X_CHANNEL_NAME: ${{ vars.BUFFER_X_CHANNEL_NAME }}
          SOCIAL_TIME_ZONE: Australia/Sydney
          SOCIAL_POST_HOUR: "8"
          SOCIAL_POST_MINUTE: "15"
          SOCIAL_WEEKLY_POST_COUNT: "7"
        run: node scripts/social-post.mjs

      - name: Commit posting history
        if: always() && (steps.social-action.outputs.value == 'publish' || steps.social-action.outputs.value == 'schedule-week')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- marketing/posting-history.json
          if git diff --cached --quiet; then
            echo "No posting-history change to commit."
          else
            git commit -m "chore: record automated social schedule"
            git push
          fi
