name: Deploy Samfa12 portal

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update public marketplace statistics
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.codex-remote-attachments' \
            --exclude='.wrangler' \
            --exclude='**/.vite/' \
            --exclude='_site' \
            --exclude='/artifacts/' \
            --exclude='/ops/' \
            --exclude='/tests/' \
            --exclude='/scripts/' \
            --exclude='/workers/' \
            --exclude='**/docs/' \
            --exclude='**/tests/' \
            --exclude='**/scripts/' \
            --exclude='**/README.md' \
            --exclude='**/package.json' \
            --exclude='**/package-lock.json' \
            --exclude='/AGENTS.md' \
            --exclude='/.gitignore' \
            --exclude='/qa-*.png' \
            ./ _site/
      - name: Verify What Would Win artifact
        run: WHAT_WOULD_WIN_SITE_ROOT=_site node scripts/verify-what-would-win-pages.mjs
      - name: Verify Briarhold artifact
        run: BRIARHOLD_SITE_ROOT=_site node scripts/verify-briarhold-pages.mjs games/briarhold/play
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
