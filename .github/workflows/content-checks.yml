name: Check catalogue content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run validate:catalogue
      - run: npm run validate:site
      - run: npm run validate:seo
      - run: npm run audit:indexing -- --check
      - run: npm run test:content
      - run: npm run test:analytics
      - run: npm run test:marketplace
      - run: npm run test:handoff-relay
      - run: npm run verify:what-would-win-pages
      - run: npm run verify:briarhold-pages -- games/briarhold/play
      - name: Stage with Pages Linux exclusions
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.codex-remote-attachments' \
            --exclude='.wrangler' \
            --exclude='.analytics' \
            --exclude='.playwright-cli' \
            --exclude='node_modules' \
            --exclude='.env*' \
            --exclude='/content/' \
            --exclude='/output/' \
            --exclude='**/.vite/' \
            --exclude='_site' \
            --exclude='/artifacts/' \
            --exclude='/ops/' \
            --exclude='/tests/' \
            --exclude='/scripts/' \
            --exclude='/workers/' \
            --exclude='**/docs/' \
            --exclude='**/tests/' \
            --exclude='**/scripts/' \
            --exclude='**/README.md' \
            --exclude='**/package.json' \
            --exclude='**/package-lock.json' \
            --exclude='/AGENTS.md' \
            --exclude='/.gitignore' \
            --exclude='/qa-*.png' \
            ./ _site/
      - run: WHAT_WOULD_WIN_SITE_ROOT=_site npm run verify:what-would-win-pages
      - run: BRIARHOLD_SITE_ROOT=_site npm run verify:briarhold-pages -- games/briarhold/play
      - run: SEO_SITE_ROOT=_site npm run validate:seo
      - run: SEO_SITE_ROOT=_site npm run audit:indexing -- --check
